<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Light</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}

  .noise{position:fixed;inset:0;z-index:300;pointer-events:none;opacity:0.05;width:100%;height:100%}

  /* ── Menu overlay ── */
  .menu-overlay{
    position:fixed;inset:0;z-index:400;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity 0.4s ease;
    cursor:default;
  }
  .menu-overlay.open{opacity:1;pointer-events:auto}
  .menu{
    max-height:80vh;overflow-y:auto;
    padding:20px 0;width:340px;
    scrollbar-width:none;
  }
  .menu::-webkit-scrollbar{display:none}
  .menu-group{
    padding:6px 24px;
    font:700 10px/1 'Helvetica Neue',sans-serif;
    letter-spacing:2px;text-transform:uppercase;
    color:rgba(255,255,255,0.35);
    margin-top:14px;
  }
  .menu-group:first-child{margin-top:0}
  .menu-item{
    padding:8px 24px;
    font:300 14px/1.4 'Helvetica Neue',sans-serif;
    color:rgba(255,255,255,0.7);
    cursor:pointer;
    transition:color 0.2s, background 0.2s;
    border-radius:4px;
  }
  .menu-item:hover{color:#fff;background:rgba(255,255,255,0.08)}
  .menu-item.active{color:#fff;font-weight:500}
  .menu-item .num{
    display:inline-block;width:22px;
    color:rgba(255,255,255,0.3);font-size:11px;
    font-variant-numeric:tabular-nums;
  }

  /* ── Pause indicator ── */
  .pause-dot{
    position:fixed;bottom:16px;right:16px;z-index:350;
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,0.4);
    opacity:0;transition:opacity 0.5s ease;
    pointer-events:none;
  }
  .pause-dot.visible{opacity:1}

  /* ── Help hint ── */
  .hint{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:350;
    font:300 11px/1 'Helvetica Neue',sans-serif;
    color:rgba(255,255,255,0.3);
    opacity:1;transition:opacity 2s ease 4s;
    pointer-events:none;
  }
  .hint.fade{opacity:0}

  /* ── Base ── */
  .bg{position:fixed;inset:0;background-color:var(--dark);transition:background-color 4.5s ease-in-out}

  /* ── Base luminosity — prevents any zone from being dead ── */
  .base-lum{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 100% 100% at 50% 50%, var(--base-lum) 0%, transparent 80%);
    transition:opacity 4.5s ease-in-out;
    opacity:0.4;
  }

  /* ── Central light wash — illuminates walls from center ── */
  .light-wash{
    position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse 60% 55% at 50% 50%, var(--wash-bright) 0%, var(--wash-mid) 35%, transparent 65%);
    opacity:0.7;
  }

  /* ── Wall illumination with screen blend ── */
  .wall-glow{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse 45% 40% at 50% 50%, var(--wg-center) 0%, transparent 100%);
    mix-blend-mode:screen;
    opacity:0.55;
  }

  /* ── Perspective walls ── */
  .wall{position:fixed;inset:0;z-index:3;transition:background-color 4.5s ease-in-out}
  .wall-side{background-color:var(--walls)}
  .wall-dark{background-color:var(--dark-wall)}

  .wall-left{clip-path:polygon(0 0,calc(50% - 9vmin) calc(50% - 9vmin),calc(50% - 9vmin) calc(50% + 9vmin),0 100%)}
  .wall-right{clip-path:polygon(100% 0,calc(50% + 9vmin) calc(50% - 9vmin),calc(50% + 9vmin) calc(50% + 9vmin),100% 100%)}
  .wall-top{clip-path:polygon(0 0,calc(50% - 9vmin) calc(50% - 9vmin),calc(50% + 9vmin) calc(50% - 9vmin),100% 0)}
  .wall-bottom{clip-path:polygon(0 100%,calc(50% - 9vmin) calc(50% + 9vmin),calc(50% + 9vmin) calc(50% + 9vmin),100% 100%)}

  /* ── Diagonal glow lines — SVG with blur filter ── */
  .edge-glow{
    position:fixed;inset:0;z-index:6;pointer-events:none;
  }
  .edge-glow line{
    stroke:var(--edge-glow);
    transition:stroke 4.5s ease-in-out;
  }

  /* ── Bloom layers (blur-based, no box-shadow rings) ── */
  .bloom{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    pointer-events:none;border-radius:8%;
  }
  .bloom-1{width:26vmin;height:26vmin;background-color:var(--glow);filter:blur(28px);opacity:0.7;z-index:8;transition:background-color 4.5s ease-in-out}
  .bloom-2{width:42vmin;height:42vmin;background-color:var(--glow);filter:blur(65px);opacity:0.4;z-index:7;border-radius:18%;transition:background-color 4.5s ease-in-out}
  .bloom-3{width:70vmin;height:70vmin;background-color:var(--glow);filter:blur(110px);opacity:0.2;z-index:6;border-radius:50%;transition:background-color 4.5s ease-in-out;animation:breathe 10s ease-in-out infinite}

  @keyframes breathe{0%,100%{opacity:0.18}50%{opacity:0.28}}

  /* ── The luminous square ── */
  .square{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:18vmin;height:18vmin;
    background-color:var(--sq);
    z-index:10;
    transition:background-color 4.5s ease-in-out, box-shadow 4.5s ease-in-out;
    box-shadow:inset 0 0 30px 10px var(--sq-bright);
  }
  .square::before{
    content:'';position:absolute;inset:10%;border-radius:50%;
    background:var(--inner);filter:blur(22px);opacity:0.4;
    transition:background 4.5s ease-in-out;pointer-events:none;
  }
</style>
</head>
<body tabindex="0">

<div class="bg"></div>
<div class="base-lum"></div>

<div class="wall wall-side wall-left"></div>
<div class="wall wall-side wall-right"></div>
<div class="wall wall-dark wall-top"></div>
<div class="wall wall-dark wall-bottom"></div>

<div class="light-wash"></div>
<div class="wall-glow"></div>

<!-- Diagonal edge glow lines — positioned by JS to match clip-path edges exactly -->
<svg class="edge-glow" id="edgeSvg" width="100%" height="100%">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" filterUnits="userSpaceOnUse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/></feMerge>
    </filter>
  </defs>
  <!-- Soft wide glow: TL TR BL BR -->
  <line id="s0" stroke-width="14" opacity="0.25" filter="url(#glow-soft)"/>
  <line id="s1" stroke-width="14" opacity="0.25" filter="url(#glow-soft)"/>
  <line id="s2" stroke-width="14" opacity="0.25" filter="url(#glow-soft)"/>
  <line id="s3" stroke-width="14" opacity="0.25" filter="url(#glow-soft)"/>
  <!-- Bright core: TL TR BL BR -->
  <line id="c0" stroke-width="4" opacity="0.4" filter="url(#glow)"/>
  <line id="c1" stroke-width="4" opacity="0.4" filter="url(#glow)"/>
  <line id="c2" stroke-width="4" opacity="0.4" filter="url(#glow)"/>
  <line id="c3" stroke-width="4" opacity="0.4" filter="url(#glow)"/>
</svg>

<div class="bloom bloom-3"></div>
<div class="bloom bloom-2"></div>
<div class="bloom bloom-1"></div>
<div class="square"></div>

<!-- Menu overlay -->
<div class="menu-overlay" id="menu">
  <div class="menu" id="menuList"></div>
</div>

<!-- Pause indicator -->
<div class="pause-dot" id="pauseDot"></div>

<!-- Initial hint -->
<div class="hint" id="hint">F — pantalla completa &nbsp;·&nbsp; M — menú &nbsp;·&nbsp; espacio — pausa &nbsp;·&nbsp; ← → — navegar</div>

<!-- Noise -->
<svg class="noise" viewBox="0 0 512 512" preserveAspectRatio="none">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

<script>
const names=[
  // THE LIGHT INSIDE
  "The Light Inside I","The Light Inside II","The Light Inside III",
  // ATEN REIGN
  "Aten Reign — Lavender","Aten Reign — Persian Blue","Aten Reign — Magenta","Aten Reign — Jade","Aten Reign — Dusk",
  // GANZFELD
  "Breathing Light","Apani","Akhob Cyan-Pink","Akhob Lavender","Ganzfeld Hot Pink","Dhatu","Aural","End Around","Perfectly Clear",
  // SKYSPACE
  "Skyspace Orange","Skyspace Teal","Skyspace Gold","Skyspace Amber-Blue","Skyspace Green-Shift","Skyspace Sunset","Skyspace Twilight","Skyspace Deep Dusk",
  // SHALLOW SPACES
  "Rondo Blue","Raemar Pink White","Fading Violet",
  // WEDGEWORKS
  "Caper, Salmon to White","Wedgework Blue",
  // PROJECTION
  "Afrum White",
  // DEEP STATES
  "Indigo-Turquoise","Crimson-Amber","Deep Rose-Peach","Aurora Violet","Lunar Blue",
];
const groups=[
  {label:"The Light Inside",from:0,to:2},
  {label:"Aten Reign",from:3,to:7},
  {label:"Ganzfeld",from:8,to:16},
  {label:"Skyspace",from:17,to:24},
  {label:"Shallow Spaces",from:25,to:27},
  {label:"Wedgeworks",from:28,to:29},
  {label:"Projection",from:30,to:30},
  {label:"Deep States",from:31,to:35},
];

const S=[
  {w:"#d020a8",d:"#14063e",s:"#7888ff",g:"#6070e8",i:"#b0c0ff"},
  {w:"#b018d8",d:"#0e0a35",s:"#48d0ff",g:"#2898e0",i:"#90e8ff"},
  {w:"#d828c0",d:"#220a4a",s:"#40dcc8",g:"#28c8b0",i:"#78ffe8"},
  {w:"#8060b0",d:"#161040",s:"#e898c0",g:"#d878a8",i:"#f8c0d8"},
  {w:"#3050b0",d:"#0a1840",s:"#f0e8d8",g:"#ddd0b0",i:"#fffaf0"},
  {w:"#d03898",d:"#2e0a24",s:"#f8d0e0",g:"#f0b0c8",i:"#ffe8f2"},
  {w:"#308860",d:"#0c2820",s:"#e8f0d8",g:"#c8d8b0",i:"#f8fff0"},
  {w:"#403850",d:"#12101c",s:"#d0a8e0",g:"#b088c0",i:"#e0c8f0"},
  {w:"#f02080",d:"#680a38",s:"#ff88c8",g:"#ff60b0",i:"#ffb8d8"},
  {w:"#f84828",d:"#681810",s:"#ff9060",g:"#ff7048",i:"#ffb890"},
  {w:"#30c0f0",d:"#0a5078",s:"#f870b0",g:"#f05098",i:"#ffa0c8"},
  {w:"#a088d0",d:"#382468",s:"#f06890",g:"#e85078",i:"#f898b0"},
  {w:"#f01060",d:"#700a30",s:"#ff60b0",g:"#ff48a0",i:"#ff98c8"},
  {w:"#2040b0",d:"#0a0a28",s:"#90c0f0",g:"#70a0d8",i:"#b8e0f8"},
  {w:"#e020d8",d:"#480a40",s:"#f090e8",g:"#e870d0",i:"#f8b0f0"},
  {w:"#e02858",d:"#580a20",s:"#f8b030",g:"#f09828",i:"#ffd058"},
  {w:"#f08828",d:"#603010",s:"#f0e0c8",g:"#e0d0a0",i:"#fff8e0"},
  {w:"#f06828",d:"#582810",s:"#a8b0c0",g:"#8898a8",i:"#c8d0d8"},
  {w:"#685038",d:"#302018",s:"#48e8b8",g:"#28d0a0",i:"#6090c8"},
  {w:"#605850",d:"#282420",s:"#e8b048",g:"#d09838",i:"#9068a8"},
  {w:"#d08830",d:"#503818",s:"#4078c8",g:"#3060b0",i:"#60a0e0"},
  {w:"#28b850",d:"#0a4820",s:"#d83838",g:"#c02828",i:"#e85858"},
  {w:"#d84828",d:"#401810",s:"#f0a848",g:"#e89830",i:"#f8d070"},
  {w:"#3040a8",d:"#121848",s:"#d8a8e8",g:"#b888d0",i:"#e8c8f8"},
  {w:"#403058",d:"#140a20",s:"#e8c888",g:"#d0b070",i:"#f0e0a8"},
  {w:"#202030",d:"#0a0a10",s:"#4888e0",g:"#3870c8",i:"#70b0f8"},
  {w:"#c88898",d:"#402830",s:"#fff0f0",g:"#f0d8d8",i:"#ffffff"},
  {w:"#584078",d:"#1c0c30",s:"#c098e0",g:"#a880c8",i:"#d8c0f0"},
  {w:"#d88058",d:"#402010",s:"#f0d8c8",g:"#e8c8a8",i:"#fff0e8"},
  {w:"#2848c0",d:"#0a1430",s:"#a8d0f0",g:"#88b8e0",i:"#d0e8ff"},
  {w:"#202028",d:"#0a0a0a",s:"#e8e0d0",g:"#d0c8b0",i:"#f8f0e8"},
  {w:"#2028a8",d:"#0a0a20",s:"#30e0d0",g:"#20c8b8",i:"#68fff0"},
  {w:"#c02020",d:"#480a0a",s:"#f0a828",g:"#d89020",i:"#f8d050"},
  {w:"#c83868",d:"#400a20",s:"#f8b898",g:"#f0a080",i:"#ffd0b8"},
  {w:"#a828a8",d:"#380a38",s:"#e058d0",g:"#c848b8",i:"#f090e0"},
  {w:"#203060",d:"#0a1028",s:"#4060b0",g:"#305098",i:"#5880c8"},
];

let cur=0,timer=null,paused=false,menuOpen=false;
const DWELL=15000;

function rgba(h,a){return`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`}
function bright(h,f){return`rgb(${Math.min(255,Math.round(parseInt(h.slice(1,3),16)*f))},${Math.min(255,Math.round(parseInt(h.slice(3,5),16)*f))},${Math.min(255,Math.round(parseInt(h.slice(5,7),16)*f))})`}
function mix(a,b,t){
  const r1=parseInt(a.slice(1,3),16),g1=parseInt(a.slice(3,5),16),b1=parseInt(a.slice(5,7),16);
  const r2=parseInt(b.slice(1,3),16),g2=parseInt(b.slice(3,5),16),b2=parseInt(b.slice(5,7),16);
  return`rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`
}

function apply(idx){
  const sc=S[idx],r=document.documentElement.style;
  r.setProperty('--walls',sc.w);
  r.setProperty('--dark',sc.d);
  r.setProperty('--dark-wall',mix(sc.d,sc.w,0.42));
  r.setProperty('--sq',sc.s);
  r.setProperty('--sq-bright',bright(sc.s,1.4));
  r.setProperty('--inner',sc.i);
  r.setProperty('--glow',sc.g);
  r.setProperty('--wash-bright',rgba(sc.w,0.4));
  r.setProperty('--wash-mid',rgba(sc.w,0.15));
  r.setProperty('--wg-center',rgba(sc.g,0.45));
  r.setProperty('--base-lum',rgba(sc.w,0.18));
  r.setProperty('--edge-glow',bright(sc.w,1.2));
  updateMenuActive();
}

function startTimer(){
  clearInterval(timer);
  if(!paused) timer=setInterval(()=>go(cur+1),DWELL);
}

function go(i){
  cur=((i%S.length)+S.length)%S.length;
  apply(cur);
  startTimer();
}

function togglePause(){
  paused=!paused;
  document.getElementById('pauseDot').classList.toggle('visible',paused);
  if(paused){clearInterval(timer)}else{startTimer()}
}

function toggleMenu(){
  menuOpen=!menuOpen;
  document.getElementById('menu').classList.toggle('open',menuOpen);
  if(menuOpen) updateMenuActive();
}

function updateMenuActive(){
  document.querySelectorAll('.menu-item').forEach((el,idx)=>{
    el.classList.toggle('active',idx===cur);
  });
}

// Build menu
function buildMenu(){
  const list=document.getElementById('menuList');
  let html='';
  groups.forEach(g=>{
    html+=`<div class="menu-group">${g.label}</div>`;
    for(let j=g.from;j<=Math.min(g.to,names.length-1);j++){
      html+=`<div class="menu-item" data-idx="${j}"><span class="num">${j+1}</span>${names[j]}</div>`;
    }
  });
  list.innerHTML=html;
  list.addEventListener('click',e=>{
    const item=e.target.closest('.menu-item');
    if(item){
      go(parseInt(item.dataset.idx));
      toggleMenu();
    }
  });
}
buildMenu();

// Position edge glow lines to match exact clip-path edges
function updateEdgeLines(){
  const w=window.innerWidth, h=window.innerHeight;
  const vmin=Math.min(w,h);
  const sq=9*vmin/100;
  const cx=w/2, cy=h/2;
  const sl=cx-sq, sr=cx+sq, st=cy-sq, sb=cy+sq;

  const svg=document.getElementById('edgeSvg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.setAttribute('width',w);
  svg.setAttribute('height',h);

  const corners=[
    [0,0,sl,st],    // top-left
    [w,0,sr,st],    // top-right
    [0,h,sl,sb],    // bottom-left
    [w,h,sr,sb],    // bottom-right
  ];
  const lines=svg.querySelectorAll('line');
  lines.forEach((ln,idx)=>{
    const c=corners[idx%4];
    ln.setAttribute('x1',c[0]);
    ln.setAttribute('y1',c[1]);
    ln.setAttribute('x2',c[2]);
    ln.setAttribute('y2',c[3]);
  });
}
updateEdgeLines();
window.addEventListener('resize',updateEdgeLines);

// Init
apply(0);
startTimer();
setTimeout(()=>document.getElementById('hint').classList.add('fade'),100);

// Position edge glow lines: viewport corners → square corners
function positionEdges(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const vmin=Math.min(vw,vh)/100;
  const half=9*vmin;
  const cx=vw/2, cy=vh/2;
  const sl=cx-half, sr=cx+half, st=cy-half, sb=cy+half;
  // corners: TL(0,0)→(sl,st), TR(vw,0)→(sr,st), BL(0,vh)→(sl,sb), BR(vw,vh)→(sr,sb)
  const lines=[
    [0,0,sl,st], [vw,0,sr,st], [0,vh,sl,sb], [vw,vh,sr,sb]
  ];
  lines.forEach((coords,idx)=>{
    ['s','c'].forEach(prefix=>{
      const el=document.getElementById(prefix+idx);
      if(el){
        el.setAttribute('x1',coords[0]);
        el.setAttribute('y1',coords[1]);
        el.setAttribute('x2',coords[2]);
        el.setAttribute('y2',coords[3]);
      }
    });
  });
}
positionEdges();
window.addEventListener('resize',positionEdges);
document.addEventListener('fullscreenchange',()=>setTimeout(positionEdges,100));

// Fullscreen
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().then(()=>setTimeout(positionEdges,200)).catch(()=>{});
  } else {
    document.exitFullscreen().then(()=>setTimeout(positionEdges,200)).catch(()=>{});
  }
}

// Keyboard
window.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFullscreen();return}
  if(e.key==='m'||e.key==='M'){e.preventDefault();toggleMenu();return}
  if(e.key==='Escape'&&menuOpen){e.preventDefault();toggleMenu();return}
  if(menuOpen) return;
  if(e.key===' '){e.preventDefault();togglePause();return}
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();go(cur+1)}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(cur-1)}
});

// Click advances only if menu closed
document.addEventListener('click',e=>{
  if(menuOpen||e.target.closest('.menu-overlay')) return;
  go(cur+1);
});

// Touch
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX});
document.addEventListener('touchend',e=>{
  if(menuOpen) return;
  const d=e.changedTouches[0].clientX-tx;
  if(Math.abs(d)>50) d<0?go(cur+1):go(cur-1);
});
document.body.focus();
</script>
</body>
</html>
